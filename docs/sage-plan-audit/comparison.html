<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sage Plan visual comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #eceaf3; color: #171722; font-family: Inter, system-ui, sans-serif; }
    h1 { margin: 0 0 20px; font-size: 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
    figure { margin: 0; overflow: hidden; border: 1px solid #d9d5e7; border-radius: 16px; background: white; box-shadow: 0 14px 34px rgba(53,47,89,.12); }
    figcaption { padding: 12px 14px; border-bottom: 1px solid #e6e3ef; font-size: 13px; font-weight: 800; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Existing Admyt language → Sage Plan</h1>
  <div class="grid">
    <figure><figcaption>Profile · calm memory surface</figcaption><img src="01-profile-empty.png" alt="Current Admyt Profile"></figure>
    <figure><figcaption>Browse · premium work surface</figcaption><img src="02-browse.png" alt="Current Admyt Browse"></figure>
    <figure><figcaption>Sage Plan · same house, next room</figcaption><img src="03-sage-plan-guest.png" alt="New Sage Plan"></figure>
  </div>
</body>
</html>
