name: Refresh Labs Console metrics

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: labs-console-metrics-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh all product metrics
        env:
          LABS_SITES_AUTHORIZATION: ${{ secrets.LABS_SITES_AUTHORIZATION }}
          LABS_SYNC_SECRET: ${{ secrets.LABS_SYNC_SECRET }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors --max-time 30 \
            --request POST \
            --header "OAI-Sites-Authorization: Bearer ${LABS_SITES_AUTHORIZATION}" \
            --header "Authorization: Bearer ${LABS_SYNC_SECRET}" \
            --output labs-console-response.json \
            https://hidustin-labs-console.dusteallen.chatgpt.site/api/internal/sync

          node -e "const fs=require('node:fs'); const result=JSON.parse(fs.readFileSync('labs-console-response.json','utf8')); if (!result.ok || result.succeeded !== result.total) { console.error(JSON.stringify(result)); process.exit(1); } console.log('Labs Console refreshed '+result.succeeded+'/'+result.total+' products.');"
